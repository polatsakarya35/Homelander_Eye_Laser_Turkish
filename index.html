<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazer Kedi Savunması</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="title" content="Lazer Kedi Savunması" />
    <meta name="description" content="göz lazerleriyle kedileri koru" />
  </head>
  <body>
    <div id="gameContainer">
      <video id="videoElement" autoplay muted playsinline></video>
      <canvas id="gameCanvas"></canvas>
      <div id="nearMissOverlay"></div>

      <div id="ui">
        <p class="ui-name">Kurtarıcı: <span id="playerName">—</span></p>
        <p>Dalga <span id="waveNum">1</span> · Yenilen: <span id="score">0</span></p>
        <p class="combo-line" id="comboLine">Combo x1</p>
        <div class="kitten-hp" id="kittenHp"></div>
        <div class="power-block">
          <div class="power-label">Güç Lazeri <span id="powerCount">3/3</span></div>
          <div id="powerCharges" class="power-charges" aria-label="Güç hakları"></div>
          <div class="power-timer"><div id="powerTimerBar"></div></div>
        </div>
        <p class="ui-hint" id="mouthHint">Ağzını aç → güç (3/3)</p>
      </div>

      <div id="milestoneBanner" aria-live="polite"></div>
      <div id="comboBanner"></div>

      <div id="leftEye" class="eye-glow" style="display: none"></div>
      <div id="rightEye" class="eye-glow" style="display: none"></div>

      <div id="start-overlay">
        <p class="brand">LAZER KEDİ SAVUNMASI</p>
        <p class="tagline">Kedilerin son umudu sensin.</p>
        <label class="nick-label" for="nicknameInput">Kurtarıcı adın</label>
        <input
          id="nicknameInput"
          type="text"
          maxlength="12"
          placeholder="örn: KediKoruyucu"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint-line">
          Gözlerinden lazer çıkar · Başını hareket ettirerek nişan al
        </p>
        <button id="startButton">⏳ Yükleniyor...</button>

        <div id="leaderboardPreview" class="leaderboard">
          <p class="lb-title">Kahramanlar Tablosu</p>
          <ol id="leaderboardList"></ol>
        </div>
      </div>

      <div id="gameOverScreen">
        <p class="go-title">Kediler yakalandı...</p>
        <p class="go-title-badge" id="runTitle">—</p>
        <p class="go-hero" id="gameOverHeroMsg"></p>
        <div id="runSummary" class="run-summary"></div>
        <p><span id="finalScore">0</span> hayalet yendin</p>
        <div id="gameOverBoard" class="leaderboard compact">
          <p class="lb-title">Kahramanlar Tablosu</p>
          <ol id="gameOverLeaderboard"></ol>
        </div>
        <button id="replayButton">Yeni Kurtarıcı</button>
        <button id="replaySameButton" class="secondary-btn">Aynı isimle devam</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.min.js"></script>
    <script src="sound.js"></script>
    <script src="main.js"></script>
  </body>
</html>
